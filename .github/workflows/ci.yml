name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # the image has LibreOffice and Tesseract's data, so the Office tests run too
      - run: docker build -t ai-sdk-liteparse .
      - run: docker run --rm ai-sdk-liteparse
